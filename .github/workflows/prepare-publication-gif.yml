name: Prepare publication GIF
on:
  push:
    branches: [codex/publication-gif-20260910]
permissions:
  contents: read
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: projects/puffin/imgs/quick_explanation.mp4
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Convert the requested 2m14s to 2m24s segment
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          mkdir -p gif-output
          ffmpeg -v error -ss 134 -t 10 -i projects/puffin/imgs/quick_explanation.mp4 -filter_complex "[0:v]fps=7,scale=400:-2:flags=lanczos,split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse=dither=sierra2_4a" -loop 0 gif-output/thinking-with-camera.gif
          ffmpeg -v error -ss 134 -t 10 -i projects/puffin/imgs/quick_explanation.mp4 -vf "fps=1/3,scale=640:-2,tile=3x1" -frames:v 1 gif-output/thinking-contact-sheet.png
          ffprobe -v error -show_entries stream=width,height,nb_frames:format=duration -of json gif-output/thinking-with-camera.gif > gif-output/metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: thinking-with-camera-gif
          path: gif-output/
          retention-days: 1
